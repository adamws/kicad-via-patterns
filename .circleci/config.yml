version: 2.1

jobs:
  test-linux:
    parameters:
      version:
        type: string
    docker:
      - image: admwscki/kicad-kbplacer-primary:<<parameters.version>>
    steps: &in-docker-test-steps
      - checkout
      - run:
          name: Prepare tests
          command: |
            pip3 install --no-cache-dir hatch
      - run:
          name: Run tests
          command: |
            hatch run test:test --junitxml=test-results/pytest/results.xml tests/
      - run:
          name: Move coverage file
          command: |
            mv .coverage .coverage-<<parameters.version>>
      - persist_to_workspace:
          root: .
          paths:
            - .coverage-<<parameters.version>>
      - store_artifacts:
          path: report.html
      - store_test_results:
          path: test-results
  collect-coverage:
    docker:
      - image: cimg/python:3.11
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m pip install coverage
      - run:
          name: Generate coverage report
          command: |
            python -m coverage combine /tmp/workspace/.coverage-*
            python -m coverage report
            python -m coverage html
      - when: # run only on master
          condition:
            equal: [ master, << pipeline.git.branch >> ]
          steps:
            - run:
                name: Publish coverage
                command: |
                  python -m pip install coveralls
                  python -m coveralls
      - store_artifacts:
          path: .coverage
      - store_artifacts:
          path: htmlcov
  test-windows:
    machine:
      image: windows-server-2022-gui:edge
      shell: powershell.exe -ExecutionPolicy Bypass
    resource_class: windows.medium
    parameters:
      kicad-version:
        type: string
    steps:
      - checkout
      - run:
          name: Install scoop and KiCad
          command: |
            irm get.scoop.sh -outfile "install.ps1"
            .\install.ps1 -RunAsAdmin -ScoopDir "C:\scoop"
            scoop config use_external_7zip true
            scoop bucket add extras
            scoop install kicad@<<parameters.kicad-version>>
            scoop cache rm --all
      - run:
          name: Install dependencies
          command: |
            .\.circleci\scripts\use-kicad-python.ps1
            python -m pip install --upgrade pip
            python -m pip install "tomli >= 1.1.0 ; python_version < '3.11'"
            $deps = python .\.circleci\scripts\get_test_env_deps.py | Where-Object { $_ -ne "" }
            python -m pip install --no-cache-dir @deps
      - run:
          name: Run tests
          command: |
            .\.circleci\scripts\use-kicad-python.ps1
            pytest --junitxml=test-results/pytest/results.xml tests
      - store_artifacts:
          path: report.html
      - store_test_results:
          path: test-results
  test-macos:
    macos:
      xcode: 16.4.0
    resource_class: m4pro.medium
    environment:
      HOMEBREW_NO_AUTO_UPDATE: 1
    parameters:
      kicad-version:
        type: string
    steps:
      - checkout
      - run:
          name: Downgrade brew
          command: | # workaround for https://github.com/orgs/Homebrew/discussions/6351
            cd "$(brew --repo)"
            git fetch
            git checkout 4.6.3
      - run:
          name: Install KiCad
          command: |
            if [ "<<parameters.kicad-version>>" = "9.0.2" ]; then
              revision=d3557f0bbb9829b1302932c575bee62e504d56ab
              filepath=Casks/k/kicad.rb
            elif [ "<<parameters.kicad-version>>" = "9.0.3" ]; then
              revision=2dd81f13990982761946fa73cc1d7b7dc74eb0b0
              filepath=Casks/k/kicad.rb
            elif [ "<<parameters.kicad-version>>" = "9.0.4" ]; then
              revision=f9214eaa52048e16dbcfaac9ffd22caea1b92fad
              filepath=Casks/k/kicad.rb
            elif [ "<<parameters.kicad-version>>" = "9.0.8" ]; then
              revision=61ef15e03fd712bbccab7fd91aa0ef6929cf5651
              filepath=Casks/k/kicad.rb
            elif [ "<<parameters.kicad-version>>" = "10.0.0" ]; then
              revision=5c96043fbafb7f6103bd06f88e6ab3347552e53c
              filepath=Casks/k/kicad.rb
            elif [ "<<parameters.kicad-version>>" = "10.0.3" ]; then
              revision=92a6bada7efb4639f3f7bfe82022363564088b02
              filepath=Casks/k/kicad.rb
            elif [ "<<parameters.kicad-version>>" = "10.0.4" ]; then
              revision=a6e42d6bc7099fc4bfc0e921cf1d2090996d5082
              filepath=Casks/k/kicad.rb
            elif [ "<<parameters.kicad-version>>" = "10.0.5" ]; then
              revision=c8b9de53a6523a874c3e86263da7940fcef40bd2
              filepath=Casks/k/kicad.rb
            else
              echo "Unsupported KiCad version!"
            fi
            curl -L https://raw.githubusercontent.com/Homebrew/homebrew-cask/$revision/$filepath > kicad.rb
            sed -i '' 's/depends_on macos: :big_sur/depends_on macos: ">= :big_sur"/' kicad.rb
            brew install kicad.rb
            rm kicad.rb
      - run:
          name: Install dependencies
          command: |
            source .circleci/scripts/use-kicad-python-macos.sh
            python -m pip install --upgrade pip
            python -m pip install 'tomli >= 1.1.0 ; python_version < "3.11"'
            python .circleci/scripts/get_test_env_deps.py \
              | xargs -r python -m pip install --no-cache-dir
      - run:
          name: Run tests
          command: |
            source .circleci/scripts/use-kicad-python-macos.sh
            pytest --junitxml=test-results/pytest/results.xml tests
      - store_artifacts:
          path: report.html
      - store_test_results:
          path: test-results
  create-pcm-package:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Setup environment variables
          command: |
            if [ -z "$CIRCLE_TAG" ]; then
              echo "Building development package"
            else
              echo "Building release package"
              echo "export PLUGIN_KICAD_STATUS=stable" >> $BASH_ENV
              echo "export PLUGIN_KICAD_RELEASE_URL=https://github.com/adamws/kicad-via-patterns/releases/download/v{version}/{zip_name}" >> $BASH_ENV
            fi
      - run:
          name: Install dependencies
          command: |
            sudo apt-get update && sudo apt-get install -y gettext
            python -m pip install --upgrade hatch
      - run:
          name: Create zip package and repository
          environment:
            HATCH_BUILD_HOOK_ENABLE_KICAD-REPOSITORY: true
          command: |
            python -m hatch build --target kicad-package
      - store_artifacts:
          path: dist/repository
      - persist_to_workspace:
          root: .
          paths:
            - dist/repository/*
      - when: # run only on master
          condition:
            equal: [ master, << pipeline.git.branch >> ]
          steps:
            - add_ssh_keys:
                fingerprints:
                  - "SHA256:TZciGCvnHAunbSU6mANR6aO6L1MnUEqQPpK5Co2t1QM"
            - run:
                name: Deploy repository to github pages
                command: |
                  ./release/deploy.sh
  create-pypi-package:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            pip install hatch==1.7.0
      - run:
          name: Create distribution archive
          command: |
            python -m hatch -v build -t sdist
      - store_artifacts:
          path: dist
      - persist_to_workspace:
          root: .
          paths:
            - dist/kicad_via_patterns*.tar.gz
  validate-pypi-package:
    parameters:
      version:
        type: string
    docker:
      - image: admwscki/kicad-kbplacer-primary:<<parameters.version>>
    environment:
      PIP_ROOT_USER_ACTION: ignore
    steps:
      - attach_workspace:
          at: /tmp
      - run:
          name: Sanity check pypi package
          command: |
            pip3 install /tmp/dist/kicad_via_patterns*.tar.gz
            python3 -c 'import via_patterns; print(via_patterns.__version__)'
  create-github-release:
    docker:
      - image: cimg/base:2023.12
    steps:
      - attach_workspace:
          at: /tmp
      - checkout
      - run:
          name: Install dependencies
          command: |
            ./release/install_gh.sh
      - run:
          name: Create draft release
          command: |
            if [ -z "$CIRCLE_TAG" ]; then exit 1; fi
            gh config set prompt disabled
            gh release create $CIRCLE_TAG --prerelease --verify-tag --title $CIRCLE_TAG
      - run:
          name: Upload artifacts to release
          command: |
            NAME=kicad_via_patterns-$(echo $CIRCLE_TAG | cut -c 2-)
            gh release upload $CIRCLE_TAG \
              /tmp/dist/$NAME.tar.gz \
              /tmp/dist/repository/$NAME.zip \
              /tmp/dist/repository/packages.json \
              /tmp/dist/repository/repository.json \
              /tmp/dist/repository/resources.zip

workflows:
  main:
    # some GUI tests and some macos tests are flaky
    # use new circleci auto-rerun feature:
    # https://circleci.com/docs/guides/orchestrate/automatic-reruns/
    max_auto_reruns: 3
    jobs:
      - test-linux:
          matrix: &linux-matrix
            parameters:
              version:
                - 9.0.9-noble
                - 10.0.5-noble
      - collect-coverage:
          requires:
            - test-linux
      - test-windows:
          matrix:
            parameters:
              kicad-version:
                - 9.0.8
                - 10.0.5
      - test-macos:
          matrix:
            parameters:
              kicad-version:
                - 9.0.8
                - 10.0.5
      - create-pcm-package:
          requires: &required-tests
            - test-linux
            - test-windows
            - test-macos
      - create-pypi-package:
          requires: *required-tests
      - validate-pypi-package:
          requires:
            - create-pypi-package
          matrix: *linux-matrix
  kicad-release:
    jobs:
      - create-pcm-package:
          filters: &tag-filter
            tags:
              only: /^v[0-9]+(\.[0-9]+)*$/
            branches:
              ignore: /.*/
      - create-pypi-package:
          filters: *tag-filter
      - create-github-release:
          filters: *tag-filter
          requires:
            - create-pcm-package
            - create-pypi-package
